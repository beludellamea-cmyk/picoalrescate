<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Videojuego educativo inclusivo para primer grado: ayudamos a PICO a recuperar las señales de la escuela con pictogramas ARASAAC.">
<meta name="theme-color" content="#19A7B0">
<title>PICO: Rescatemos las Señales</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="world">
      <div id="bgs"><div class="bg" id="bgA"></div><div class="bg" id="bgB"></div></div>
      <div id="scene"></div>
    </div>
    <div id="deck"></div>
    <canvas id="fx" width="1920" height="1080" aria-hidden="true"></canvas>
    <div id="fxdom" aria-hidden="true"></div>
    <div id="hud" hidden>
      <button type="button" id="btnMenu" class="hbtn menu" aria-label="MENÚ"></button>
      <div id="stars" role="img" aria-label="ESTRELLAS"></div>
      <div id="bubble" aria-live="off">
        <p id="bubbleText"></p>
        <button type="button" id="btnRepeat" class="round" aria-label="ESCUCHAR OTRA VEZ"></button>
      </div>
      <button type="button" id="btnAcc" class="hbtn acc" aria-label="ACCESIBILIDAD"></button>
      <button type="button" id="btnSnd" class="hbtn snd" aria-label="SONIDO"></button>
    </div>
    <div id="modal" hidden></div>
    <div id="gate" hidden>
      <img src="img/pico/wave_a.webp" alt="" class="gpico" width="300" height="280">
      <button type="button" id="gateBtn" class="btn btn-go btn-huge"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 8v32l26-16z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg><span>¡TOCÁ PARA EMPEZAR!</span></button>
      <p class="gtxt">PICO TE ESPERA</p>
    </div>
    <div id="curtain"><i></i></div>
  </div>
</div>
<div id="printArea" aria-hidden="true"></div>
<div id="sr" class="sr" aria-live="polite"></div>
<noscript><p style="font:24px sans-serif;padding:24px">ESTE JUEGO NECESITA JAVASCRIPT.</p></noscript>
<script src="js/voces.js"></script>
<script src="js/audio.js"></script>
<script src="js/pico.js"></script>
<script src="js/core.js"></script>
<script src="js/screens.js"></script>
<script src="js/levels.js"></script>
<script src="js/main.js"></script>
</body>
</html>
